server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
    mcp:
      client:
        enabled: true
        name: finnews-orchestrator
        sse:
          connections:
            financial:
              url: ${MCP_SERVER_URL}
              sse-endpoint: /sse?token=${MCP_SERVER_TOKEN}&groups=advanced_scraping,finance
        request-timeout: 240s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    io.modelcontextprotocol.spec.McpClientSession: OFF
